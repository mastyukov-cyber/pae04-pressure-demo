name: PAE-04 diagnostics consent demo (synthetic WebKit)
on:
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/**'
      - 'qa/diagnostics-demo*'
      - 'playwright-diagnostics.config.cjs'
      - '.github/workflows/pae04-diagnostics-demo-webkit.yml'
permissions:
  contents: read
concurrency:
  group: pae04-diagnostics-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit-synthetic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact QA draft
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse ESM and browser test fixtures
        run: |
          node --check diagnostics/demo/demo.mjs
          node --check diagnostics/preview-model.mjs
          node --check diagnostics/basic-contract.mjs
          node --check diagnostics/contract.mjs
          node --check qa/diagnostics-demo-server.cjs
          node --check qa/diagnostics-demo.spec.cjs
      - name: Install pinned WebKit QA runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.65.0
      - name: Install sandbox WebKit dependencies
        run: npx playwright install --with-deps webkit
      - name: Test mobile three-mode consent and no external telemetry
        run: npx playwright test -c playwright-diagnostics.config.cjs --reporter=line
      - name: Upload anonymous failure screenshot only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pae04-diagnostics-preview-synthetic-failures
          path: diagnostics-test-results/
          retention-days: 3
          if-no-files-found: ignore
